[package]
name = "scribup_live"
version = "0.1.0"
edition = "2021"
description = "Écran live ScribUp dans FL Studio : ce que tu écris sur le téléphone, en direct"
# Les bindings VST3 de nih-plug sont sous GPLv3
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { workspace = true }
nih_plug_egui = { workspace = true }
serde_json = "1"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

[features]
# Pour essayer la fenêtre hors de FL (example « standalone »)
standalone = ["nih_plug/standalone"]

[[example]]
name = "standalone"
required-features = ["standalone"]
