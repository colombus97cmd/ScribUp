name: ScribUp (Android + pont PC)

on:
  push:
    paths:
      - "android/**"
      - "pc-bridge/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "pc-bridge/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      preview:
        description: "Afficher les captures d'écran (réduites, base64) dans le journal"
        type: boolean
        default: false

jobs:
  pc-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy "websockets>=13" pytest
      - run: python -m pytest -q pc-bridge/tests

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests unitaires + APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: scribup-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Vérifie sur un vrai Android (émulateur) que le SDK Claude se charge et dialogue avec l'API.
  android-device:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pont PC en mode démo (joignable depuis l'émulateur en 10.0.2.2)
        run: |
          pip install numpy "websockets>=13"
          nohup python pc-bridge/scribup_bridge.py --demo --pin 4242 > bridge.log 2>&1 &
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest
            adb pull /sdcard/Pictures/ScribUp ../screenshots || true
      - name: Aperçu des captures dans le journal
        if: inputs.preview
        run: |
          pip install pillow
          python - <<'PY'
          import base64, io, pathlib
          from PIL import Image
          for png in sorted(pathlib.Path("screenshots").glob("*.png")):
              img = Image.open(png).convert("RGB")
              img.thumbnail((380, 900))
              buf = io.BytesIO()
              img.save(buf, "JPEG", quality=55)
              print(f"=== {png.name} ===")
              print(base64.b64encode(buf.getvalue()).decode())
          PY
      - name: Journal du pont
        if: always()
        run: cat bridge.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scribup-screenshots
          path: screenshots/
          if-no-files-found: ignore
